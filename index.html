<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grove - Shared Household Sanctuary</title>
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase Realtime Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d1b12; color: #f4f6f4; -webkit-tap-highlight-color: transparent; }
        input, button { touch-action: manipulation; }
    </style>
</head>
<body class="bg-[#0d1b12] text-[#f4f6f4] min-h-screen flex flex-col antialiased selection:bg-[#2d4a35]">
    <div id="root"></div>

    <script type="text/babel">
        // Firebase Config Connection
        const firebaseConfig = {
            databaseURL: "https://grove-68e31-default-rtdb.firebasedatabase.app/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const VAULT_REF = db.ref('grove_vault_1102');

        const CATEGORIES = [
            { id: 'groceries', name: 'Groceries', color: '#82a36b', icon: '🍃' },
            { id: 'transport', name: 'Transportation', color: '#5b8266', icon: '🌿' },
            { id: 'bills', name: 'Bills', color: '#c4824d', icon: '🪵' },
            { id: 'subs', name: 'Subscriptions', color: '#b57352', icon: '🌱' },
            { id: 'misc', name: 'Misc', color: '#7a8c79', icon: '🪴' }
        ];

        function App() {
            const [tab, setTab] = React.useState('keypad'); // keypad, calendar, goals
            const [amount, setAmount] = React.useState('0');
            const [who, setWho] = React.useState('Marquis');
            const [selectedCategory, setSelectedCategory] = React.useState('groceries');
            const [isRecurring, setIsRecurring] = React.useState(false);
            const [recurringFreq, setRecurringFreq] = React.useState('monthly');

            // Shared State Tree
            const [transactions, setTransactions] = React.useState([]);
            const [goals, setGoals] = React.useState([
                { id: 1, name: 'Spring Weekend Getaway', target: 600, current: 250 },
                { id: 2, name: 'Living Room Upgrade', target: 400, current: 180 }
            ]);
            const [budgets, setBudgets] = React.useState({
                groceries: 500, transport: 200, bills: 1200, subs: 100, misc: 150
            });
            const [incomes, setIncomes] = React.useState([]);
            const [syncStatus, setSyncStatus] = React.useState('Syncing...');

            // Realtime Sync Listener
            React.useEffect(() => {
                VAULT_REF.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        if (data.transactions) setTransactions(Object.values(data.transactions));
                        if (data.goals) setGoals(Object.values(data.goals));
                        if (data.budgets) setBudgets(data.budgets);
                        if (data.incomes) setIncomes(Object.values(data.incomes));
                    }
                    setSyncStatus('Connected 🌱');
                }, (error) => {
                    setSyncStatus('Sync Error ⚠️');
                });
            }, []);

            const syncToCloud = (path, data) => {
                db.ref(`grove_vault_1102/${path}`).set(data);
            };

            // Keypad Logic
            const handleNumPad = (val) => {
                if (val === 'C') {
                    setAmount('0');
                } else if (val === 'DEL') {
                    setAmount(prev => prev.length > 1 ? prev.slice(0, -1) : '0');
                } else {
                    setAmount(prev => prev === '0' ? val : prev + val);
                }
            };

            const handleLogExpense = (catId) => {
                const num = parseFloat(amount);
                if (!num || num <= 0) return;

                const newTx = {
                    id: Date.now(),
                    amount: num,
                    category: catId,
                    who,
                    date: new Date().toISOString(),
                    isRecurring,
                    recurringFreq: isRecurring ? recurringFreq : null,
                    status: isRecurring ? 'pending' : 'completed'
                };

                const updated = [newTx, ...transactions];
                setTransactions(updated);
                syncToCloud('transactions', updated);
                setAmount('0');
                setIsRecurring(false);
            };

            const handleLogIncome = () => {
                const num = parseFloat(amount);
                if (!num || num <= 0) return;

                const newInc = {
                    id: Date.now(),
                    amount: num,
                    who,
                    date: new Date().toISOString(),
                    isRecurring,
                    recurringFreq: isRecurring ? recurringFreq : null,
                    status: isRecurring ? 'pending' : 'completed'
                };

                const updated = [newInc, ...incomes];
                setIncomes(updated);
                syncToCloud('incomes', updated);
                setAmount('0');
                setIsRecurring(false);
            };

            // Math calculations
            const totalSpent = transactions.filter(t => t.status === 'completed').reduce((acc, t) => acc + t.amount, 0);
            const totalIncome = incomes.filter(i => i.status === 'completed').reduce((acc, i) => acc + i.amount, 0);
            const marquisPaid = transactions.filter(t => t.who === 'Marquis' && t.status === 'completed').reduce((acc, t) => acc + t.amount, 0);
            const malikaPaid = transactions.filter(t => t.who === 'Malika' && t.status === 'completed').reduce((acc, t) => acc + t.amount, 0);
            const pendingItems = [...transactions, ...incomes].filter(i => i.status === 'pending');

            // Category spending totals
            const catTotals = CATEGORIES.reduce((acc, cat) => {
                acc[cat.id] = transactions.filter(t => t.category === cat.id && t.status === 'completed').reduce((sum, t) => sum + t.amount, 0);
                return acc;
            }, {});

            const totalBudgetLimit = Object.values(budgets).reduce((a, b) => a + b, 0);
            const safeToSpend = totalIncome - totalSpent;

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-[#122218] shadow-2xl pb-24 border-x border-[#1e3827]">
                    
                    {/* Header Canopy */}
                    <header className="p-4 bg-[#16291e] border-b border-[#223e2c] sticky top-0 z-30">
                        <div className="flex justify-between items-center mb-3">
                            <div className="flex items-center space-x-2">
                                <span className="text-2xl">🌱</span>
                                <h1 className="text-xl font-bold tracking-tight text-[#e2ede3]">GROVE</h1>
                            </div>
                            <span className="text-xs px-2.5 py-1 rounded-full bg-[#1e3827] text-[#9ab89d] border border-[#2c4e38]">
                                {syncStatus}
                            </span>
                        </div>

                        {/* Summary Card */}
                        <div className="bg-[#1b3324] rounded-2xl p-4 border border-[#294c35] shadow-inner">
                            <div className="flex justify-between items-center mb-2">
                                <div>
                                    <p className="text-xs text-[#8ca88e] uppercase tracking-wider font-medium">Safe-to-Spend Surplus</p>
                                    <p className={`text-2xl font-bold ${safeToSpend >= 0 ? 'text-[#a3c9a8]' : 'text-rose-400'}`}>
                                        ${safeToSpend.toFixed(2)}
                                    </p>
                                </div>
                                <div className="text-right">
                                    <p className="text-xs text-[#8ca88e] uppercase tracking-wider font-medium">Total Income</p>
                                    <p className="text-lg font-semibold text-[#e2ede3]">${totalIncome.toFixed(2)}</p>
                                </div>
                            </div>
                            <div className="pt-2 border-t border-[#254631] flex justify-between text-xs text-[#9ab89d]">
                                <span>Marquis Paid: <strong className="text-[#e2ede3]">${marquisPaid.toFixed(2)}</strong></span>
                                <span>Malika Paid: <strong className="text-[#e2ede3]">${malikaPaid.toFixed(2)}</strong></span>
                            </div>
                        </div>

                        {/* Pending Banner Alert */}
                        {pendingItems.length > 0 && (
                            <div className="mt-3 bg-[#c4824d]/20 border border-[#c4824d]/40 rounded-xl p-2.5 flex justify-between items-center text-xs text-[#e8c3a9]">
                                <span>🔔 {pendingItems.length} recurring item(s) pending review</span>
                                <button onClick={() => setTab('calendar')} className="underline font-bold">Review</button>
                            </div>
                        )}
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 p-4 overflow-y-auto">
                        
                        {/* TAB 1: KEYPAD */}
                        {tab === 'keypad' && (
                            <div className="space-y-4">
                                
                                {/* Who Paid & Recurring Switcher */}
                                <div className="flex bg-[#1a3323] p-1 rounded-xl border border-[#2a4d36] text-sm">
                                    <button 
                                        onClick={() => setWho('Marquis')} 
                                        className={`flex-1 py-2 rounded-lg font-medium transition ${who === 'Marquis' ? 'bg-[#31573f] text-white shadow' : 'text-[#8ca88e]'}`}>
                                        Marquis
                                    </button>
                                    <button 
                                        onClick={() => setWho('Malika')} 
                                        className={`flex-1 py-2 rounded-lg font-medium transition ${who === 'Malika' ? 'bg-[#31573f] text-white shadow' : 'text-[#8ca88e]'}`}>
                                        Malika
                                    </button>
                                </div>

                                <div className="flex items-center justify-between px-2 text-xs text-[#8ca88e]">
                                    <label className="flex items-center space-x-2 cursor-pointer">
                                        <input 
                                            type="checkbox" 
                                            checked={isRecurring} 
                                            onChange={(e) => setIsRecurring(e.target.checked)}
                                            className="rounded accent-[#5b8266]"
                                        />
                                        <span>Mark as Recurring</span>
                                    </label>
                                    {isRecurring && (
                                        <select 
                                            value={recurringFreq} 
                                            onChange={(e) => setRecurringFreq(e.target.value)}
                                            className="bg-[#1b3324] text-[#e2ede3] border border-[#2f543c] rounded px-2 py-1 text-xs">
                                            <option value="monthly">Monthly</option>
                                            <option value="biweekly">Bi-Weekly</option>
                                            <option value="weekly">Weekly</option>
                                        </select>
                                    )}
                                </div>

                                {/* Amount Display */}
                                <div className="bg-[#172e20] border border-[#294c35] rounded-2xl p-4 text-center">
                                    <span className="text-xs text-[#7c9e7e] uppercase tracking-widest block mb-1">Entry Amount</span>
                                    <div className="text-4xl font-extrabold text-[#e2ede3] tracking-tight">
                                        ${amount}
                                    </div>
                                </div>

                                {/* Category Grid Rings (2x3) */}
                                <div className="grid grid-cols-3 gap-2.5">
                                    {CATEGORIES.map(cat => {
                                        const spent = catTotals[cat.id] || 0;
                                        const limit = budgets[cat.id] || 1;
                                        const pct = Math.min(Math.round((spent / limit) * 100), 100);

                                        return (
                                            <button
                                                key={cat.id}
                                                onClick={() => handleLogExpense(cat.id)}
                                                className="bg-[#183021] border border-[#284a34] hover:border-[#427050] p-3 rounded-2xl flex flex-col items-center text-center relative overflow-hidden transition active:scale-95 group">
                                                
                                                {/* Progress bar background fill */}
                                                <div 
                                                    className="absolute bottom-0 left-0 right-0 bg-[#2b4f37]/40 transition-all"
                                                    style={{ height: `${pct}%`, zIndex: 0 }}
                                                />
                                                
                                                <span className="text-xl mb-1 relative z-10">{cat.icon}</span>
                                                <span className="text-xs font-semibold text-[#d4ded5] relative z-10">{cat.name}</span>
                                                <span className="text-[10px] text-[#8ca88e] relative z-10 mt-0.5">${spent.toFixed(0)} /${limit}</span>
                                            </button>
                                        );
                                    })}

                                    {/* 6th Slot: Income / Payday */}
                                    <button
                                        onClick={handleLogIncome}
                                        className="bg-[#1e3c29] border border-[#376145] hover:bg-[#254b33] p-3 rounded-2xl flex flex-col items-center text-center transition active:scale-95">
                                        <span className="text-xl mb-1">💰</span>
                                        <span className="text-xs font-semibold text-[#a3c9a8]">Income</span>
                                        <span className="text-[10px] text-[#7ca881] mt-0.5">Log Payday</span>
                                    </button>
                                </div>

                                {/* Built-In Cash App Keypad */}
                                <div className="grid grid-cols-3 gap-2 pt-2">
                                    {['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'DEL'].map((btn) => (
                                        <button
                                            key={btn}
                                            onClick={() => handleNumPad(btn)}
                                            className="bg-[#162b1e] border border-[#254631] hover:bg-[#1f3b28] text-[#e2ede3] font-bold text-lg py-3.5 rounded-xl transition active:bg-[#295237]">
                                            {btn}
                                        </button>
                                    ))}
                                </div>

                            </div>
                        )}

                        {/* TAB 2: CALENDAR & HISTORY */}
                        {tab === 'calendar' && (
                            <div className="space-y-4">
                                <div className="bg-[#183021] border border-[#284a34] rounded-2xl p-4">
                                    <h2 className="text-sm font-semibold text-[#a3c9a8] mb-3 flex items-center justify-between">
                                        <span>📅 Cash Flow & Pending Schedule</span>
                                    </h2>
                                    
                                    {pendingItems.length > 0 ? (
                                        <div className="space-y-2 mb-4">
                                            <p className="text-xs text-[#8ca88e]">Tap to confirm pending items:</p>
                                            {pendingItems.map(item => (
                                                <div key={item.id} className="bg-[#1f3c29] p-3 rounded-xl border border-[#355c42] flex justify-between items-center text-xs">
                                                    <div>
                                                        <p className="font-bold text-[#e2ede3]">${item.amount} ({item.who})</p>
                                                        <p className="text-[10px] text-[#9ab89d]">{new Date(item.date).toLocaleDateString()}</p>
                                                    </div>
                                                    <button 
                                                        onClick={() => {
                                                            const updated = transactions.map(t => t.id === item.id ? {...t, status: 'completed'} : t);
                                                            setTransactions(updated);
                                                            syncToCloud('transactions', updated);
                                                        }}
                                                        className="bg-[#427050] hover:bg-[#528763] text-white px-3 py-1.5 rounded-lg font-semibold">
                                                        Confirm Paid
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <p className="text-xs text-[#7c9e7e] italic mb-4">No pending bills or paydays right now.</p>
                                    )}

                                    <h3 className="text-xs font-semibold text-[#8ca88e] uppercase tracking-wider mb-2">Recent Log History</h3>
                                    <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                        {transactions.map(t => (
                                            <div key={t.id} className="bg-[#152a1d] p-2.5 rounded-xl border border-[#223e2c] flex justify-between items-center text-xs">
                                                <div>
                                                    <span className="font-bold text-[#e2ede3] uppercase tracking-wide">{t.category}</span>
                                                    <span className="text-[#8ca88e] ml-2">({t.who})</span>
                                                    <p className="text-[10px] text-[#6b8c6e]">{new Date(t.date).toLocaleDateString()}</p>
                                                </div>
                                                <div className="flex items-center space-x-3">
                                                    <span className="font-bold text-[#a3c9a8]">${t.amount.toFixed(2)}</span>
                                                    <button 
                                                        onClick={() => {
                                                            const updated = transactions.filter(x => x.id !== t.id);
                                                            setTransactions(updated);
                                                            syncToCloud('transactions', updated);
                                                        }}
                                                        className="text-rose-400 hover:text-rose-300 text-xs">✕</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                                                {/* TAB 3: GOALS */}
                        {tab === 'goals' && (
                            <div className="space-y-4">
                                <div className="bg-[#183021] border border-[#284a34] rounded-2xl p-4">
                                    <h2 className="text-sm font-semibold text-[#a3c9a8] mb-3">🪴 Greenhouse Savings Goals</h2>
                                    
                                    {/* Add New Goal Form */}
                                    <div className="bg-[#152a1d] border border-[#254631] p-3 rounded-xl mb-4 space-y-2">
                                        <p className="text-xs text-[#8ca88e] font-medium">Create New Goal</p>
                                        <input 
                                            type="text" 
                                            id="newGoalName" 
                                            placeholder="Goal Name (e.g., Vacation)" 
                                            className="w-full bg-[#1b3324] text-[#e2ede3] border border-[#2a4d36] rounded-lg px-3 py-2 text-xs outline-none focus:border-[#5b8266]"
                                        />
                                        <input 
                                            type="number" 
                                            id="newGoalTarget" 
                                            placeholder="Target Amount ($)" 
                                            className="w-full bg-[#1b3324] text-[#e2ede3] border border-[#2a4d36] rounded-lg px-3 py-2 text-xs outline-none focus:border-[#5b8266]"
                                        />
                                        <button 
                                            onClick={() => {
                                                const nameInput = document.getElementById('newGoalName');
                                                const targetInput = document.getElementById('newGoalTarget');
                                                const name = nameInput.value.trim();
                                                const target = parseFloat(targetInput.value);

                                                if (!name || !target || target <= 0) return;

                                                const newGoalObj = {
                                                    id: Date.now(),
                                                    name: name,
                                                    target: target,
                                                    current: 0
                                                };

                                                const updated = [...goals, newGoalObj];
                                                setGoals(updated);
                                                syncToCloud('goals', updated);

                                                nameInput.value = '';
                                                targetInput.value = '';
                                            }}
                                            className="w-full bg-[#31573f] hover:bg-[#427050] text-white py-2 rounded-lg text-xs font-semibold transition">
                                            + Plant New Goal
                                        </button>
                                    </div>

                                    {/* Goals List */}
                                    <div className="space-y-3">
                                        {goals.length > 0 ? goals.map(goal => {
                                            const pct = Math.min(Math.round((goal.current / goal.target) * 100), 100);
                                            return (
                                                <div key={goal.id} className="bg-[#152a1d] border border-[#254631] p-3.5 rounded-xl relative">
                                                    
                                                    {/* Delete Goal Button */}
                                                    <button 
                                                        onClick={() => {
                                                            const updated = goals.filter(g => g.id !== goal.id);
                                                            setGoals(updated);
                                                            syncToCloud('goals', updated);
                                                        }}
                                                        className="absolute top-3 right-3 text-rose-400 hover:text-rose-300 text-xs font-bold px-2 py-1">
                                                        ✕
                                                    </button>

                                                    <div className="flex justify-between items-center mb-1 text-xs font-semibold pr-6">
                                                        <span className="text-[#e2ede3]">{goal.name}</span>
                                                        <span className="text-[#a3c9a8]">${goal.current} /${goal.target}</span>
                                                    </div>
                                                    
                                                    {/* Botanical Progress Bar */}
                                                    <div className="w-full bg-[#1b3324] h-2.5 rounded-full overflow-hidden mb-3 border border-[#2a4d36]">
                                                        <div className="bg-[#5b8266] h-full transition-all" style={{ width: `${pct}%` }} />
                                                    </div>

                                                    <button 
                                                        onClick={() => {
                                                            const addAmt = prompt("Enter amount to add to goal:", "50");
                                                            if (addAmt && !isNaN(addAmt)) {
                                                                const updated = goals.map(g => g.id === goal.id ? {...g, current: g.current + parseFloat(addAmt)} : g);
                                                                setGoals(updated);
                                                                syncToCloud('goals', updated);
                                                            }
                                                        }}
                                                        className="w-full bg-[#254631] hover:bg-[#31573f] text-[#e2ede3] py-2 rounded-lg text-xs font-semibold transition">
                                                        + Add Funds
                                                    </button>
                                                </div>
                                            );
                                        }) : (
                                            <p className="text-xs text-[#7c9e7e] italic text-center py-4">No active greenhouse goals. Plant one above!</p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}


                    </main>

                    {/* Bottom Navigation Dock */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#14261c] border-t border-[#223e2c] px-6 py-3 flex justify-around items-center z-40 shadow-lg">
                        <button 
                            onClick={() => setTab('keypad')} 
                            className={`flex flex-col items-center space-y-1 transition ${tab === 'keypad' ? 'text-[#a3c9a8]' : 'text-[#6b8c6e]'}`}>
                            <span className="text-lg">⌨️</span>
                            <span className="text-[10px] font-medium">Keypad</span>
                        </button>
                        <button 
                            onClick={() => setTab('calendar')} 
                            className={`flex flex-col items-center space-y-1 transition ${tab === 'calendar' ? 'text-[#a3c9a8]' : 'text-[#6b8c6e]'}`}>
                            <span className="text-lg">📅</span>
                            <span className="text-[10px] font-medium">Calendar</span>
                        </button>
                        <button 
                            onClick={() => setTab('goals')} 
                            className={`flex flex-col items-center space-y-1 transition ${tab === 'goals' ? 'text-[#a3c9a8]' : 'text-[#6b8c6e]'}`}>
                            <span className="text-lg">🪴</span>
                            <span className="text-[10px] font-medium">Goals</span>
                        </button>
                    </nav>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
